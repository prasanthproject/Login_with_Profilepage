<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
 
</head>
<body class="signup-page min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <main class="bg-white w-full max-w-4xl p-6 md:p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Student Signup</h1>
        <form id="signupForm" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
            <div>
                <label for="studentName" class="block text-sm font-medium text-gray-700 mb-1">Student Name</label>
                <input type="text" id="studentName" name="studentName" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter student name">
                <p class="text-red-500 text-sm" id="studentNameError"></p>
            </div>
            <div>
                <label for="age" class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                <input type="number" id="age" name="age" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter age">
                <p class="text-red-500 text-sm" id="ageError"></p>
            </div>
            <div>
                <label for="rollNumber" class="block text-sm font-medium text-gray-700 mb-1">Roll Number</label>
                <input type="text" id="rollNumber" name="rollNumber" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter roll number">
                <p class="text-red-500 text-sm" id="rollNumberError"></p>
            </div>
            <div>
                <label for="className" class="block text-sm font-medium text-gray-700 mb-1">Class</label>
                <input type="text" id="className" name="className" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter class">
                <p class="text-red-500 text-sm" id="classNameError"></p>
            </div>
            <div>
                <label for="dob" class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                <input type="date" id="dob" name="dob" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-red-500 text-sm" id="dobError"></p>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter email">
                <p class="text-red-500 text-sm" id="emailError"></p>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter password">
                <p class="text-red-500 text-sm" id="passwordError"></p>
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Confirm password">
                <p class="text-red-500 text-sm" id="confirmPasswordError"></p>
            </div>
            <button type="submit" class="w-full md:col-span-2 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Sign Up</button>
        </form>
        <p class="text-center text-sm text-gray-600 mt-4">
            Already have an account?
            <a href="login.html" class="text-blue-600 hover:underline">Login</a>
        </p>
    </main>
<script src="signup.js"></script>
</body>
</html>
