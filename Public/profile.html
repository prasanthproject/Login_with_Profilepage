<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 p-6">
<div class="mx-auto max-w-xl rounded-xl bg-white p-8 shadow">
<div class="mb-6 flex items-center justify-between gap-4">
<h1 class="text-2xl font-bold">Student Profile</h1>
<button id="logoutButton" class="rounded-lg bg-red-600 px-4 py-2 text-white">Logout</button>
</div>
<p id="profileMessage" class="text-gray-600">Loading profile...</p>
<div id="profileDetails" class="mt-6 hidden space-y-4">
<p><strong>Student Name:</strong> <span id="studentName"></span></p>
<p><strong>Age:</strong> <span id="age"></span></p>
<p><strong>Roll Number:</strong> <span id="rollNumber"></span></p>
<p><strong>Class:</strong> <span id="className"></span></p>
<p><strong>Date of Birth:</strong> <span id="dob"></span></p>
<p><strong>Email:</strong> <span id="email"></span></p>
</div>
</div>
<script src="profile.js"></script>
</body>
</html>
