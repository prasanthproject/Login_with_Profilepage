
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">

    <div class="w-full max-w-sm bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold text-center mb-6">Login</h1>

        <form id="loginForm">
            <label for="email" class="block mb-2">Email</label>
            <input type="email" id="email" class="w-full border rounded-md p-2 mb-1" placeholder="Enter your email">
            <p id="emailError" class="text-red-500 text-sm mb-4"></p>

            <label for="password" class="block mb-2">Password</label>
            <input type="password" id="password" class="w-full border rounded-md p-2 mb-1" placeholder="Enter your password">
            <p id="passwordError" class="text-red-500 text-sm mb-4"></p>

            <p id="loginError" class="text-red-500 text-sm mb-4" role="alert"></p>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">Login</button>
        </form>
          <p class="text-center text-sm text-gray-600 mt-4">
           I want New Account
            <a href="signup.html" class="text-blue-600 hover:underline">Signup</a>
        </p>
    </div>

<script src="Login.js">
</script>
</body>
</html>
